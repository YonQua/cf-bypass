name: cf-bypass

services:
  # Cloudflare 绕过服务
  cloudflare-bypass:
    # 使用当前目录构建镜像
    image: cf-bypass:latest
    build: .
    # 容器名称
    container_name: cf-bypass
    # 重启策略：容器退出时自动重启
    restart: unless-stopped
    # CloakBrowser 使用 headful + Xvfb，尽量贴近真实桌面浏览器环境
    command: ['xvfb-run', '-a', 'npm', 'start']
    # 端口映射：默认宿主机8080端口映射到容器8080端口，可用 HOST_PORT 覆盖宿主机端口
    ports:
      - '${HOST_PORT:-8080}:8080'
    # 环境变量配置
    environment:
      # 服务端口
      - PORT=8080
      # 最大并发浏览器数量
      - browserLimit=3
      # 超时时间（毫秒）
      - timeOut=90000
      # API认证令牌（留空表示不需要）
      - authToken=
      # CloakBrowser 固定指纹与地区参数，降低同一出口反复表现为新设备的概率
      - CLOAKBROWSER_HEADLESS=false
      - CLOAKBROWSER_HUMANIZE=true
      - CLOAKBROWSER_STEALTH_ARGS=true
      - CLOAKBROWSER_FINGERPRINT_SEED=cf-bypass-poc-001
      - CLOAKBROWSER_TIMEZONE=America/New_York
      - CLOAKBROWSER_LOCALE=en-US
      - CLOAKBROWSER_AUTO_UPDATE=false
      - CLOAKBROWSER_CACHE_DIR=/app/.cloakbrowser
    # 共享内存大小：Chrome需要较大共享内存
    shm_size: '2gb'
    # 初始化进程：处理僵尸进程
    init: true
    # 健康检查
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 基本资源限制（普通 compose 生效）
    mem_limit: 2g
    cpus: '2.0'
    # 日志轮转
    logging:
      driver: 'json-file'
      options:
        max-size: '100k'
        max-file: '1'
        tag: '{{.Name}}'
    # 数据卷挂载：持久化缓存数据
    volumes:
      - ./cache:/app/cache
