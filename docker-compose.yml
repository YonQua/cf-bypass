name: cf-bypass

services:
  # Cloudflare 绕过服务
  cloudflare-bypass:
    # 使用当前目录构建镜像
    image: cf-bypass:latest
    build: .
    # 容器名称
    container_name: cf-bypass
    # 重启策略：容器退出时自动重启
    restart: unless-stopped
    # 端口映射：宿主机8080端口映射到容器8080端口
    ports:
      - '8080:8080'
    # 环境变量配置
    environment:
      # 服务端口
      - PORT=8080
      # 最大并发浏览器数量
      - browserLimit=20
      # 超时时间（毫秒）
      - timeOut=60000
      # API认证令牌（留空表示不需要）
      - authToken=
      # 跳过Puppeteer自动下载Chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    # 共享内存大小：Chrome需要较大共享内存
    shm_size: '2gb'
    # 初始化进程：处理僵尸进程
    init: true
    # 健康检查
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 基本资源限制（普通 compose 生效）
    mem_limit: 1g
    cpus: '1.0'
    # 日志轮转
    logging:
      driver: 'json-file'
      options:
        max-size: '100k'
        max-file: '1'
        tag: '{{.Name}}'
    # 数据卷挂载：持久化缓存数据
    volumes:
      - ./cache:/app/cache
